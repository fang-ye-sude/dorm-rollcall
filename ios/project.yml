name: DormRoll
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: YOURTEAMID
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "20261105"
targets:
  DormRoll:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # 想内置离线名册副本时，另建 bundle/ 目录并加下面这段：
      # - path: bundle
      #   type: folder
      #   name: Roster
      #   buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "20261108"
        CFBundleDisplayName: 宿舍点名
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dormroll
        PRODUCT_NAME: DormRoll
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ENABLE_BITCODE: NO
