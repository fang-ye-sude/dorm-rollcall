plugins { id 'com.android.application' }

android {
    namespace 'com.example.dormroll'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.dormroll"
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName "2.0.6"
    }

    // 签名：把 keystore.properties（见根目录示例）放好才会签；没有就出未签名包
    def keyProps = new Properties()
    def keyFile = rootProject.file("keystore.properties")
    def hasKey = keyFile.exists()
    if (hasKey) {
        keyFile.withInputStream { keyProps.load(it) }
    }

    signingConfigs {
        release {
            if (hasKey) {
                storeFile rootProject.file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKey ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
